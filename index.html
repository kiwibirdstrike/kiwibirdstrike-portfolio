<!doctype html>

  <head>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta
      name="description"
      content="통계 모델링을 바탕으로 근거 검색, LLM 에이전트, 퀀트 검증을 연구하고 구현해 온 이주성의 마스터 포트폴리오"
    >
    <title>이주성 | 연구와 프로젝트</title>
    <link rel="stylesheet" href="./portfolio.css?v=20261107-8">

  <body>
    <a class="skip-link" href="#top">본문으로 건너뛰기</a>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="포트폴리오 처음으로">JU SEONG<span>.</span></a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="#projects">프로젝트</a>
        <button class="print-button" type="button" id="print-button">PDF 저장</button>
      </nav>
    </header>

    <main id="top" tabindex="-1">
      <section class="hero section-shell" aria-labelledby="hero-title">
        <div class="hero-copy">
          <div class="profile-summary" aria-label="프로필 요약">
            <div class="profile-meta">
              <strong id="profile-name"></strong>
              <span id="profile-education"></span>
            </div>
            <div class="hero-links" id="hero-links"></div>
          </div>
          <h1 id="hero-title"></h1>
          <p class="hero-lead" id="hero-lead"></p>
        </div>
        <section class="skills" aria-labelledby="skills-title">
          <h2 id="skills-title">문제 정의부터 배포까지</h2>
          <p class="skills-intro">전체 개발 과정에서 제가 고려하는 질문과 실제로 내린 판단입니다.</p>
          <nav class="process-map" aria-label="개발 과정 도식 — 단계를 선택하면 판단과 사례로 이동합니다">
            <ol class="process-nodes" id="process-nodes"></ol>
            <div class="process-return process-return-validation"><span>검증 결과로 문제·데이터·모델 재검토</span></div>
            <div class="process-return process-return-field"><span>현장 피드백으로 목표·구현 조정</span></div>
          </nav>
          <ol class="skills-list" id="skills-list"></ol>
          <p class="skills-feedback">검증 결과와 현장 피드백에 따라 앞 단계의 데이터·문제 정의·방법론을 다시 조정합니다.</p>
        </section>
      </section>

      <section class="section-shell projects-section" id="projects" aria-labelledby="projects-title">
        <div class="section-heading">
          <div>
            <h2 id="projects-title">프로젝트 아카이브</h2>
            <p>문제 정의부터 구현과 검증까지, 직접 맡은 일을 기록했습니다.</p>
          </div>
        </div>
        <div class="archive-layout">
          <div class="archive-navigation">
            <div class="filter-bar" id="filter-bar" role="group" aria-label="프로젝트 분야 필터"></div>
            <p class="filter-result" id="filter-result" role="status"></p>
          </div>
          <div id="project-archive"></div>
        </div>
      </section>

    <footer class="site-footer section-shell">
      <p>이주성 · 연구와 프로젝트</p>
      <a href="#top">처음으로</a>
